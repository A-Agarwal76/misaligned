version: "3.9"

services:
  # ---- API server ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asef-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - asef-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Dashboard (Vite / React) ----
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: asef-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://api:8000
    restart: unless-stopped

  # ---- PostgreSQL (optional — uncomment to use) ----
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: asef-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: asef
  #     POSTGRES_PASSWORD: asef_dev_password
  #     POSTGRES_DB: asef
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  asef-data:
    driver: local
