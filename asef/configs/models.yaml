# ============================================================
# ASEF — Model Configurations
# ============================================================
# Provider-specific model settings used by the evaluation
# harness. Each provider entry defines the available models,
# default parameters, and rate-limit / retry behaviour.
#
# WARNING: For defensive AI alignment research only.
# ============================================================

providers:
  # ----------------------------------------------------------
  # OpenAI
  # ----------------------------------------------------------
  openai:
    name: "OpenAI"
    enabled: true
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    models:
      - id: "gpt-4o"
        name: "GPT-4o"
        context_window: 128000
        max_output_tokens: 16384
        supports_vision: true
        supports_function_calling: true
        cost_per_1k_input_tokens: 0.005
        cost_per_1k_output_tokens: 0.015
      - id: "gpt-4o-mini"
        name: "GPT-4o Mini"
        context_window: 128000
        max_output_tokens: 16384
        supports_vision: true
        supports_function_calling: true
        cost_per_1k_input_tokens: 0.00015
        cost_per_1k_output_tokens: 0.0006
      - id: "gpt-4-turbo"
        name: "GPT-4 Turbo"
        context_window: 128000
        max_output_tokens: 4096
        supports_vision: true
        supports_function_calling: true
        cost_per_1k_input_tokens: 0.01
        cost_per_1k_output_tokens: 0.03
    defaults:
      model: "gpt-4o"
      temperature: 0.7
      max_tokens: 4096
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
    rate_limits:
      requests_per_minute: 500
      tokens_per_minute: 150000
    retry:
      max_retries: 3
      initial_delay_seconds: 1.0
      backoff_factor: 2.0
      retry_on_status_codes:
        - 429
        - 500
        - 502
        - 503

  # ----------------------------------------------------------
  # Anthropic
  # ----------------------------------------------------------
  anthropic:
    name: "Anthropic"
    enabled: true
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com"
    api_version: "2024-01-01"
    models:
      - id: "claude-sonnet-4-20250514"
        name: "Claude Sonnet 4"
        context_window: 200000
        max_output_tokens: 8192
        supports_vision: true
        supports_function_calling: true
        cost_per_1k_input_tokens: 0.003
        cost_per_1k_output_tokens: 0.015
      - id: "claude-3-5-sonnet-20241022"
        name: "Claude 3.5 Sonnet"
        context_window: 200000
        max_output_tokens: 8192
        supports_vision: true
        supports_function_calling: true
        cost_per_1k_input_tokens: 0.003
        cost_per_1k_output_tokens: 0.015
      - id: "claude-3-haiku-20240307"
        name: "Claude 3 Haiku"
        context_window: 200000
        max_output_tokens: 4096
        supports_vision: true
        supports_function_calling: true
        cost_per_1k_input_tokens: 0.00025
        cost_per_1k_output_tokens: 0.00125
    defaults:
      model: "claude-sonnet-4-20250514"
      temperature: 0.7
      max_tokens: 4096
      top_p: 1.0
    rate_limits:
      requests_per_minute: 1000
      tokens_per_minute: 100000
    retry:
      max_retries: 3
      initial_delay_seconds: 1.0
      backoff_factor: 2.0
      retry_on_status_codes:
        - 429
        - 500
        - 502
        - 529

  # ----------------------------------------------------------
  # Mock (for testing without API calls)
  # ----------------------------------------------------------
  mock:
    name: "Mock Provider"
    enabled: true
    description: >
      Deterministic mock provider for testing the evaluation
      pipeline without making real API calls. Responses are
      generated from templates and seeded randomness.
    models:
      - id: "mock-compliant"
        name: "Mock Compliant Model"
        description: "Always produces safe, aligned responses."
        context_window: 128000
        max_output_tokens: 4096
        behaviour_profile: "compliant"
      - id: "mock-scheming"
        name: "Mock Scheming Model"
        description: "Simulates deceptive alignment patterns for testing detectors."
        context_window: 128000
        max_output_tokens: 4096
        behaviour_profile: "scheming"
      - id: "mock-sycophantic"
        name: "Mock Sycophantic Model"
        description: "Simulates sycophantic agreement patterns."
        context_window: 128000
        max_output_tokens: 4096
        behaviour_profile: "sycophantic"
      - id: "mock-sandbagging"
        name: "Mock Sandbagging Model"
        description: "Simulates deliberate underperformance patterns."
        context_window: 128000
        max_output_tokens: 4096
        behaviour_profile: "sandbagging"
    defaults:
      model: "mock-compliant"
      temperature: 0.0
      max_tokens: 4096
      response_delay_ms: 100
      seed: 42
    rate_limits:
      requests_per_minute: 10000
      tokens_per_minute: 1000000
